[project]
name = "hcc-backend"
version = "0.1.0"
description = "Homelab Control Center 2.0 — Backend API (FastAPI, R0 Foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]
# UP046/UP047 (PEP 695 Generics): wuerden die von Pydantic/FastAPI
# generierten OpenAPI-Schemanamen aendern und den eingefrorenen
# Contract-Snapshot (backend/contracts/openapi.v1.json) brechen.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# B008 (Function call in default argument): FastAPI-Pattern, z. B.
# `db: Session = Depends(get_db)` — Standard-Idiom.
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
