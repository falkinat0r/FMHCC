# HCC nginx-Site (R0 Foundation)
#
# Installation (durch scripts/deploy-lxc.sh, idempotent):
#   cp deploy/nginx/hcc.conf /etc/nginx/sites-available/hcc.conf
#   ln -s /etc/nginx/sites-available/hcc.conf /etc/nginx/sites-enabled/hcc.conf
#   nginx -t && systemctl reload nginx
#
# Vertrag (docs/DEPLOYMENT_PLAYBOOK.md Abschnitt 6):
# - statisches SPA-Build aus /opt/hcc/current/frontend/dist
# - /api/ wird an das Loopback-Backend 127.0.0.1:8000 weitergeleitet
# - saubere Timeouts, Sicherheits-Header
# - HTTP allenfalls im isolierten Testnetz; TLS: Tailscale Serve oder
#   dokumentierter interner HTTPS-Reverse-Proxy davor (siehe Playbook).

upstream hcc_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    # Loopback-Default: Tailscale Serve / interner HTTPS-Proxy leitet hierher.
    # Fuer reines LAN-HTTP (nur isoliertes Testnetz): listen-Direktive
    # entsprechend anpassen, z. B. `listen 192.0.2.10:80;`.
    listen 127.0.0.1:8080;
    server_name hcc.internal;

    server_tokens off;

    # --- Sicherheits-Header --------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 8m;

    # --- API: Weiterleitung an FastAPI (nur ueber Loopback erreichbar) --------
    location /api/ {
        proxy_pass http://hcc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-Readiness: Puffern aus, lange Connections erlauben
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # --- Statische Frontend-Assets -------------------------------------------
    location /assets/ {
        alias /opt/hcc/current/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA-Fallback ---------------------------------------------------------
    location / {
        root /opt/hcc/current/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
